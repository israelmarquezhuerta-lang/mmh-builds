<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">MMH — Computadoras</title>
  <desc id="description">Ícono futurista y minimalista con monograma geométrico MMH en blanco y turquesa sobre fondo azul noche.</desc>
  <defs>
    <radialGradient id="aura" cx="50%" cy="46%" r="66%">
      <stop offset="0" stop-color="#102A3A"/>
      <stop offset=".62" stop-color="#0B1726"/>
      <stop offset="1" stop-color="#070D17"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#74F6DF"/>
      <stop offset="1" stop-color="#34B9EA"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#aura)"/>
  <rect x="42" y="42" width="940" height="940" rx="190" fill="none" stroke="#86A7C5" stroke-opacity=".09" stroke-width="3"/>

  <!-- Monograma geométrico MMH -->
  <g fill="none" stroke="#F2F7FC" stroke-width="31" stroke-linecap="square" stroke-linejoin="bevel">
    <path d="M205 612V412l104 100 104-100v200"/>
    <path d="M407 612V412l104 100 104-100v200"/>
  </g>
  <g fill="none" stroke="url(#neon)" stroke-width="31" stroke-linecap="square" stroke-linejoin="bevel" filter="url(#softGlow)">
    <path d="M663 412v200m0-100h156m0-100v200"/>
  </g>

  <!-- Señal de circuito, deliberadamente discreta -->
  <path d="M820 512h47v-58h34" fill="none" stroke="url(#neon)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".78"/>
  <circle cx="901" cy="454" r="9" fill="#74F6DF"/>
</svg>
