<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 440" role="img" aria-label="PC gaming de alto rendimiento con iluminación RGB">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#39434a"/>
      <stop offset=".3" stop-color="#171c21"/>
      <stop offset=".72" stop-color="#080b0e"/>
      <stop offset="1" stop-color="#323940"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b9f5ff" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#83d9f2" stop-opacity=".035"/>
      <stop offset="1" stop-color="#b8fa68" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#56616a"/>
      <stop offset=".18" stop-color="#222a30"/>
      <stop offset=".8" stop-color="#111519"/>
      <stop offset="1" stop-color="#414b52"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#414b50"/>
      <stop offset=".45" stop-color="#14191c"/>
      <stop offset="1" stop-color="#303a40"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#71edff"/>
      <stop offset=".5" stop-color="#9c8aff"/>
      <stop offset="1" stop-color="#bdff68"/>
    </linearGradient>
    <radialGradient id="fan-light">
      <stop stop-color="#7ceaff" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#8b8dff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#b8fa68" stop-opacity=".04"/>
    </radialGradient>
    <filter id="shadow" x="-.5" y="-.4" width="2" height="2">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-.7" y="-.7" width="2.4" height="2.4">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="fan">
      <circle r="25" fill="#0b1014" stroke="#56656d" stroke-width="2"/>
      <circle r="21" fill="url(#fan-light)" stroke="url(#rgb)" stroke-width="1.5"/>
      <g class="fan-rotor">
        <path d="M-3-4C-12-11-17-20-10-22-1-24 3-15 3-5Z" fill="#b8eaf0" fill-opacity=".78"/>
        <path d="M-3-4C-12-11-17-20-10-22-1-24 3-15 3-5Z" transform="rotate(72)" fill="#b8eaf0" fill-opacity=".78"/>
        <path d="M-3-4C-12-11-17-20-10-22-1-24 3-15 3-5Z" transform="rotate(144)" fill="#b8eaf0" fill-opacity=".78"/>
        <path d="M-3-4C-12-11-17-20-10-22-1-24 3-15 3-5Z" transform="rotate(216)" fill="#b8eaf0" fill-opacity=".78"/>
        <path d="M-3-4C-12-11-17-20-10-22-1-24 3-15 3-5Z" transform="rotate(288)" fill="#b8eaf0" fill-opacity=".78"/>
      </g>
      <circle r="5" fill="#11181c" stroke="#c4f5e9" stroke-opacity=".8"/>
      <circle r="2" fill="url(#rgb)"/>
    </g>
    <clipPath id="glass-clip">
      <path d="m130 105 218 13-14 228-203-13z"/>
    </clipPath>
  </defs>
  <style>
    .fan-rotor { transform-box: fill-box; transform-origin: center; animation: fan-spin 2.8s linear infinite; }
    .fan-two { animation-duration: 3.4s; }
    .fan-three { animation-duration: 2.4s; }
    .rgb-glow { animation: glow-pulse 3s ease-in-out infinite alternate; }
    @keyframes fan-spin { to { transform: rotate(360deg); } }
    @keyframes glow-pulse { from { opacity: .65; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fan-rotor, .rgb-glow { animation: none !important; }
    }
  </style>
  <ellipse cx="236" cy="383" rx="137" ry="19" fill="#000" opacity=".55" filter="url(#shadow)"/>
  <ellipse cx="230" cy="378" rx="101" ry="8" fill="#72eaff" opacity=".16" filter="url(#glow)"/>

  <g class="rgb-glow" filter="url(#glow)" opacity=".55">
    <path d="m129 140 210 13-9 171-195-13z" fill="none" stroke="#6be7ff" stroke-width="4"/>
    <path d="m95 171 27 4v140l-27-3z" fill="#b8fa68" opacity=".2"/>
  </g>

  <path d="m101 77 34-25 235 15-32 29z" fill="url(#metal)" stroke="#73818a" stroke-opacity=".55" stroke-width="2"/>
  <path d="m370 67 23 17-15 281-26 18 15-287z" fill="url(#case)" stroke="#56636a" stroke-width="2"/>
  <path d="m93 89 277-7-15 291-263-15z" fill="url(#case)" stroke="#87939a" stroke-width="2"/>

  <path d="m98 101 30 3-12 243-29-2z" fill="#0a0d10" stroke="#4c5960" stroke-width="2"/>
  <path d="m101 117 19 2-10 197-19-1z" fill="#151b1f"/>
  <g stroke="#65747a" stroke-opacity=".65" stroke-width="2">
    <path d="m99 133 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1m-18 9 17 1"/>
  </g>
  <circle cx="106" cy="96" r="2" fill="#b8fa68"/>
  <circle cx="359" cy="95" r="2" fill="#6be7ff"/>

  <path d="m130 105 218 13-14 228-203-13z" fill="#0b1115" stroke="#9baeb4" stroke-opacity=".7" stroke-width="3"/>
  <g clip-path="url(#glass-clip)">
    <path d="m132 107 214 13-13 224-202-13z" fill="#10171b"/>
    <path d="m143 123 145 8-11 200-146-9z" fill="#172126" stroke="#4c5e65" stroke-width="2"/>
    <path d="m156 144 112 7-1 15-112-7z" fill="#242f35" stroke="#53636a"/>
    <circle cx="212" cy="181" r="31" fill="#0b1115" stroke="#65757d" stroke-width="3"/>
    <circle cx="212" cy="181" r="25" fill="none" stroke="url(#rgb)" stroke-width="2" opacity=".9"/>
    <circle cx="212" cy="181" r="18" fill="#172127" stroke="#78888e" stroke-opacity=".55"/>
    <path d="m212 167 4 10 11 4-11 4-4 10-4-10-11-4 11-4z" fill="url(#rgb)" opacity=".85"/>
    <path d="m159 213 9 1-5 84-9-1zm14 1 9 1-5 84-9-1zm14 1 9 1-5 84-9-1z" fill="url(#metal)" stroke="#718087" stroke-width="1"/>
    <path d="m160 216 9 1m5 0 9 1m5 0 9 1" stroke="#b8fa68" stroke-width="2" opacity=".75"/>
    <path d="m203 216 9 1 3 73-9-1zm15 1 9 1 3 73-9-1z" fill="#26353a" stroke="#6b7d82"/>
    <path d="m211 220 1 64m15-63 1 64" stroke="url(#rgb)" stroke-width="2" opacity=".65"/>

    <path d="m151 269 119 7-4 47-118-8z" fill="url(#gpu)" stroke="#819098" stroke-width="2"/>
    <path d="m154 275 111 7-1 5-111-7z" fill="url(#rgb)" opacity=".9" filter="url(#glow)"/>
    <circle cx="188" cy="300" r="15" fill="#0d1316" stroke="#62727a" stroke-width="2"/>
    <circle cx="188" cy="300" r="11" fill="none" stroke="#75dcf0" stroke-opacity=".7"/>
    <path d="M188 289c-5 2-4 8 0 10 4-2 5-8 0-10m-10 11c2 5 8 4 10 0-2-4-8-5-10 0m11 10c5-2 4-8 0-10-4 2-5 8 0 10" fill="#98abb0" opacity=".8"/>
    <circle cx="231" cy="303" r="15" fill="#0d1316" stroke="#62727a" stroke-width="2"/>
    <circle cx="231" cy="303" r="11" fill="none" stroke="#b8fa68" stroke-opacity=".7"/>
    <path d="M231 292c-5 2-4 8 0 10 4-2 5-8 0-10m-10 11c2 5 8 4 10 0-2-4-8-5-10 0m11 10c5-2 4-8 0-10-4 2-5 8 0 10" fill="#98abb0" opacity=".8"/>
    <path d="m161 323 105 7m-104-3 68 5" stroke="#91a1a5" stroke-opacity=".6"/>
    <path d="m278 141 32 2 2 9-32-2zm-1 12 32 2 2 9-32-2zm-1 12 32 2 2 9-32-2z" fill="#28343a" stroke="#84949a" stroke-width="1"/>
    <path d="M286 149h19m-20 12h19m-20 12h19" stroke="url(#rgb)" stroke-width="2" opacity=".8"/>
    <path d="m278 201c-21-9-31-5-38 5m37 4c-17-5-25 1-31 11m-1-65c12-17 25-20 41-12" fill="none" stroke="#3d5962" stroke-width="3"/>

    <g transform="translate(315 151)"><use href="#fan"/></g>
    <g transform="translate(311 218)"><use href="#fan" class="fan-two"/></g>
    <g transform="translate(307 285)"><use href="#fan" class="fan-three"/></g>

    <path d="m137 110 22 2-14 221-22-2z" fill="#e8ffff" opacity=".055"/>
    <path d="m327 121 13 1-13 211-13-1z" fill="#b8fa68" opacity=".045"/>
  </g>

  <path d="m130 105 218 13-14 228-203-13z" fill="url(#glass)" stroke="#c7edf2" stroke-opacity=".64" stroke-width="2.5"/>
  <path d="m135 110 207 13" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
  <path d="m138 331 190 12" stroke="#6be7ff" stroke-opacity=".4" stroke-width="2"/>
  <path d="m370 92 10-9m-27 281 18-14" stroke="#a9b7bc" stroke-width="3" stroke-linecap="round"/>
  <path d="m145 365 202 12" stroke="#252e33" stroke-width="8" stroke-linecap="round"/>
  <path d="m168 372 156 9" stroke="url(#rgb)" stroke-opacity=".7" stroke-width="2" filter="url(#glow)"/>
  <path d="m171 84 162 10" stroke="#bac7cb" stroke-opacity=".34" stroke-width="2"/>
</svg>
